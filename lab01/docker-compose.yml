services:
  postgres:
    image: postgres:17
    container_name: mosud-postgres
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      # Хост-порт 5433, т.к. 5432 может быть занят локальной службой PostgreSQL.
      - "5433:5432"
    volumes:
      - mosud_pgdata:/var/lib/postgresql/data

volumes:
  mosud_pgdata:
